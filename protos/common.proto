syntax = "proto3";

package common;

option go_package = "github.com/lightsparkdev/spark/proto/common";

import "validate/validate.proto";

/*
 * A map from a string to a bytes. It's a workaround to have map arrays in proto.
 */
message PackageMap {
    map<string, bytes> packages = 1;
}

/*
 * A commitment for frost signing.
 * It's a pair of public keys (points) in secp256k1 curve.
 */
 message SigningCommitment {
    // The public key for hiding. 33 bytes.
    bytes hiding = 1;

    // The public key for binding. 33 bytes.
    bytes binding = 2;
}

message SigningResult {
    bytes signature_share = 1;
}

enum SignatureIntent {
    CREATION = 0;
    TRANSFER = 1;
    AGGREGATE = 2;
    REFRESH = 3 [deprecated = true];
    EXTEND = 4 [deprecated = true];
}

// The scheme used to produce a Signature.
enum SignatureScheme {
    SIGNATURE_SCHEME_UNSPECIFIED = 0;
    // secp256k1 ECDSA, strict DER encoding (variable length).
    SIGNATURE_SCHEME_ECDSA = 1;
    // BIP-340 Schnorr over secp256k1, 64 bytes.
    SIGNATURE_SCHEME_SCHNORR = 2;
}

// A signature tagged with the scheme used to produce it, which determines how to verify it.
message Signature {
    SignatureScheme scheme = 1 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
    bytes signature = 2 [(validate.rules).bytes.min_len = 1];
}
