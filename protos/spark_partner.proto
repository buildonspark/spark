syntax = "proto3";

package spark_partner;

option go_package = "github.com/lightsparkdev/spark/proto/spark_partner";

import "spark.proto";
import "validate/validate.proto";

// SparkPartnerService exposes partner-facing read endpoints.
service SparkPartnerService {
    // query_spark_transaction_volumes returns aggregated transaction volume for the
    // authenticated partner over the requested date range, optionally scoped by
    // transaction type and network.
    rpc query_spark_transaction_volumes(QuerySparkTransactionVolumesRequest) returns (QuerySparkTransactionVolumesResponse) {}
}

enum SparkTransactionType {
    SPARK_TRANSACTION_TYPE_UNSPECIFIED = 0;
    SPARK_TRANSACTION_TYPE_TRANSFER = 1;
    SPARK_TRANSACTION_TYPE_LIGHTNING_SEND = 2;
    SPARK_TRANSACTION_TYPE_LIGHTNING_RECEIVE = 3;
    SPARK_TRANSACTION_TYPE_COOPERATIVE_EXIT = 4;
    SPARK_TRANSACTION_TYPE_DEPOSIT = 5;
}

message QuerySparkTransactionVolumesRequest {
    string start_date = 1 [(validate.rules).string = {len: 10, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}];
    string end_date = 2 [(validate.rules).string = {len: 10, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}];
    // If empty, results include all transaction types. Otherwise results are
    // scoped to the listed types (e.g. [LIGHTNING_SEND, LIGHTNING_RECEIVE]).
    repeated SparkTransactionType transaction_types = 3 [(validate.rules).repeated = {items: {enum: {defined_only: true, not_in: [0]}}}];
    // If unset, results include all networks. When set, results are scoped to that
    // single network. All defined networks (MAINNET, REGTEST, TESTNET, SIGNET) are allowed.
    optional spark.Network network = 4 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
    // Optional partner label (sub-account). If empty, results contain one entry per
    // (label, transaction_type) pair across all of the authenticated partner's labels;
    // if set, results are scoped to that label (still one entry per transaction type).
    // Always scoped to the authenticated partner_id regardless of this value.
    string label = 5 [(validate.rules).string = {max_len: 255}];
}

// TransactionVolumeEntry holds the aggregated transaction volume for a single
// (label, transaction type) pair over the requested date range.
message TransactionVolumeEntry {
    string label = 1;
    SparkTransactionType transaction_type = 2;
    int64 volume_sats = 3;
    int64 transaction_count = 4;
}

message QuerySparkTransactionVolumesResponse {
    string partner_id = 1;
    string start_date = 2;
    string end_date = 3;
    // One entry per (label, transaction type) pair. When the request specifies a
    // label, entries are scoped to that label; otherwise they span all of the
    // authenticated partner's labels.
    repeated TransactionVolumeEntry entries = 4;
    int64 total_volume_sats = 5;
    int64 total_transaction_count = 6;
}
