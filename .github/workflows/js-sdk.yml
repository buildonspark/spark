name: "JS SDK Checks"

on:
  push:
    branches:
      - main
    paths:
      - "signer/**"
      - "protos/**"
      - "sdks/js/**"
      - ".github/workflows/js-sdk.yml"
  pull_request:
    paths:
      - "signer/**"
      - "protos/**"
      - "sdks/js/**"
      - ".github/workflows/js-sdk.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  checks:
    # Don't run on commits that are synced from private repository.
    # if: github.event_name == 'pull_request' || ! (github.event_name == 'push' && contains(github.event.head_commit.message, 'GitOrigin-RevId'))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # 20 is the minimum supported workspace build runtime.
          # TODO: Restore 24.x once the native dependency build hang on 24.16 is resolved.
          - node-version: "20.x"
          - node-version: "24.15.0"
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Run JS SDK checks"
        uses: ./public/actions/js-sdk-checks
        with:
          node-version: ${{ matrix.node-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
