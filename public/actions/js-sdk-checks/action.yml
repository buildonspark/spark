name: "JS SDK checks"
description: "Runs generated proto checks, build, lint, format, package checks, and tests for the Spark JS SDK"
inputs:
  node-version:
    description: "Node.js version spec passed to actions/setup-node"
    required: true
  workspace:
    description: "Working directory for the JS SDK workspace"
    required: false
    default: "sdks/js"
  repo-token:
    description: "Token passed to third-party setup actions requiring authentication"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: "Install Protoc"
      uses: arduino/setup-protoc@v3
      with:
        version: "33.2"
        repo-token: ${{ inputs.repo-token }}

    - name: "Setup Node.js and Yarn"
      uses: ./public/actions/setup-node-yarn-install
      with:
        node-version: ${{ inputs.node-version }}
        cwd: ${{ inputs.workspace }}

    - name: "Run JS SDK checks"
      shell: bash
      working-directory: ${{ inputs.workspace }}
      run: yarn checks

    - name: "Check generated JS proto files"
      shell: bash
      working-directory: ${{ inputs.workspace }}
      run: yarn run generate:proto:check

    - name: "Configure bounded Ubuntu package downloads"
      shell: bash
      run: |
        # The Azure mirror can serve release metadata and then stall on package indexes.
        if [[ -f /etc/apt/apt-mirrors.txt ]]; then
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
        fi
        sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null <<'EOF'
        Acquire::Retries "3";
        Acquire::http::Timeout "30";
        Acquire::https::Timeout "30";
        DPkg::Lock::Timeout "60";
        EOF

    - name: "Verify Android 16kb page size alignment"
      shell: bash
      working-directory: ${{ inputs.workspace }}
      run: |
        if ! command -v llvm-objdump &> /dev/null; then
          sudo apt-get update && sudo apt-get install -y llvm
        fi

        bash ../../public/scripts/verify-android-page-size.sh

    - name: "Verify Android minimum API compatibility"
      shell: bash
      working-directory: ${{ inputs.workspace }}
      run: |
        if ! command -v llvm-objdump &> /dev/null; then
          sudo apt-get update && sudo apt-get install -y llvm
        fi

        bash ../../public/scripts/verify-android-min-api.sh
